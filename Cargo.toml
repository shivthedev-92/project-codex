[package]
name = "spellbook"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A retro fantasy terminal grimoire that lets humans and AI agents talk to, diagnose, and repair hardware."
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
toml = "0.9"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
